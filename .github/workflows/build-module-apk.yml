name: Build module.apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename app-debug.apk to module.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk module.apk

      - name: Upload module.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-apk
          path: module.apk
          if-no-files-found: error
